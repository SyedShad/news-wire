[project]
name = "open-source-ai-news-wire"
version = "0.2.0"
description = "Local-first AI news monitoring and editorial review dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1.1,<4",
  "httpx>=0.28.1,<1",
]

[project.scripts]
open-source-ai-news-wire = "open_source_ai_news_wire.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_source_ai_news_wire*"]

[tool.setuptools.package-data]
open_source_ai_news_wire = [
  "templates/*.html",
  "templates/partials/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
  "definitions/*.json",
  "schemas/*.json",
]

[dependency-groups]
dev = [
  "pytest>=9.1.0,<10",
  "pytest-cov>=7,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.0,<10",
  "pytest-cov>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-q",
  "--tb=short",
]

[tool.coverage.run]
branch = true
source = ["src/open_source_ai_news_wire", "skills/last30days/scripts", "tests"]
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
# Coverage gate (issue #254). Floor intended to rise over time, not a ceiling.
# Baseline measured 2026-07-03 on main before feat/hosted-api-mode
# (source = scripts + tests): TOTAL 84.06%. Gate pinned at that baseline.
# Do not lower without documenting why in the PR (see AGENTS.md Rules).
fail_under = 84
omit = [
  "skills/last30days/scripts/lib/vendor/*",
  "dist/*",
]
