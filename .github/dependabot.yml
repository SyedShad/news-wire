version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /mcp
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns:
          - "*"
