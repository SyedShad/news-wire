name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Block known vulnerabilities in the locked Python dependency graph.
      - name: Run uv audit against locked dependencies
        run: uv audit --locked

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain private-repository fallback
        if: github.event.repository.private
        run: |
          echo "::notice::GitHub dependency review requires Advanced Security for private repositories. The locked graph is enforced by the separate uv dependency-audit job."

      - name: Checkout
        if: ${{ !github.event.repository.private }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for diff-aware scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action derives the commit range from the GitHub event and fails on
      # verified secrets. Keep output limited to verified findings to avoid noisy
      # unverified annotations.
      - name: Run TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.95.5
          extra_args: --results=verified

  sast-scan:
    name: SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 # v1.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Semgrep CE scans the repository with the high-signal default community
      # rules and blocks the change on a finding. An explicit registry config is
      # required when anonymous metrics are disabled; `--config=auto` exits
      # before scanning in that mode.
      - name: Run blocking high-confidence News Wire SAST scan
        env:
          SEMGREP_SEND_METRICS: off
        run: semgrep scan --error --severity ERROR --config=p/default src/open_source_ai_news_wire
