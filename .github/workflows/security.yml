name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # Block known vulnerabilities in the locked Python dependency graph.
      - name: Run uv audit against locked dependencies
        run: uv audit --locked

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain private-repository fallback
        if: github.event.repository.private
        run: |
          echo "::notice::GitHub dependency review requires Advanced Security for private repositories. The locked graph is enforced by the separate uv dependency-audit job."

      - name: Checkout
        if: ${{ !github.event.repository.private }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Review dependency changes
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history for diff-aware scanning
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action derives the commit range from the GitHub event and fails on
      # verified secrets. Keep output limited to verified findings to avoid noisy
      # unverified annotations.
      - name: Run TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: 3.95.5
          extra_args: --results=verified

  sast-scan:
    name: SAST scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 # v1.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Semgrep CE scans the repository with the high-signal default community
      # rules and blocks the change on a finding. An explicit registry config is
      # required when anonymous metrics are disabled; `--config=auto` exits
      # before scanning in that mode.
      - name: Run Semgrep SAST scan
        env:
          SEMGREP_SEND_METRICS: off
        run: semgrep scan --config=p/default
