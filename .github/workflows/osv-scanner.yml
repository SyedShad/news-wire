name: OSV-Scanner

# OSV scans both release changes and weekly vulnerability drift. The reporter
# is a blocking PR gate while the report artifact is retained even on failure.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, Mondays at 12:30 UTC.
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan locked dependencies
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --recursive
            ./

      - name: Produce advisory report and annotations
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Retain OSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: results.sarif
          retention-days: 5
