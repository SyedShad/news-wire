<article class="story-card article-card">
  <div class="story-card-body">
    <div class="eyebrow-row"><span class="tag">Fetched</span><span class="eyebrow">{{ article.lane }}</span></div>
    <h3><a href="{{ url_for('article_detail', article_id=article.id) }}">{{ article.title }}</a></h3>
    <p>{{ article.summary }}</p>
    <div class="story-meta"><span>{{ article.publisher }}</span><span>Fetched {{ article.first_fetched_at|wire_time }}</span><span>Published {{ article.published_at|wire_time if article.published_at else 'Unknown' }}</span></div>
    <a href="{{ article.canonical_url|safe_external_url }}" target="_blank" rel="noopener noreferrer">Visit source ↗</a>
  </div>
  <a class="arrow-link" href="{{ url_for('article_detail', article_id=article.id) }}" aria-label="Open {{ article.title }}">→</a>
</article>
